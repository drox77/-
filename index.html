<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYLAR — Premium Dimension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #030303;
      --bg-2: #111216;
      --bg-3: #1c1d22;
      --pearl: rgba(255,255,255,.78);
      --silver: rgba(213, 218, 230, .5);
      --glass: rgba(255,255,255,.08);
      --glass-strong: rgba(255,255,255,.14);
      --card-radius: 32px;
      --shadow-premium: 0 30px 80px rgba(0,0,0,.58), 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 60px rgba(210,220,255,.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      color: #fff;
      background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3), #0d0d10);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      overflow-x: hidden;
    }
    @keyframes gradientShift { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }

    #particleCanvas, .grid, .noise, .mouse-glow { position: fixed; inset: 0; pointer-events: none; }
    #particleCanvas { z-index: 0; }
    .grid {
      z-index: 1; opacity: .15;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridFlow 18s linear infinite;
    }
    @keyframes gridFlow { from { transform: translateY(0);} to { transform: translateY(42px);} }
    .noise { z-index: 2; opacity: .08; background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.2) 1px, transparent 1px); background-size: 3px 3px; }
    .mouse-glow {
      z-index: 3;
      background: radial-gradient(circle 560px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,.09), transparent 70%);
      transition: background .15s linear;
    }

    .loader {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center;
      background: rgba(5,5,8,.84);
      backdrop-filter: blur(14px);
      animation: loaderOut .7s ease 2s forwards;
    }
    .logo {
      letter-spacing: .35em; font-size: clamp(40px,8vw,90px); font-weight: 800;
      color: var(--pearl);
      text-shadow: 0 0 35px rgba(255,255,255,.35);
      animation: logoIn 2s cubic-bezier(.23,1,.32,1) both;
    }
    @keyframes logoIn { from { opacity: 0; transform: scale(.5); filter: blur(12px);} to {opacity:1;transform:scale(1);filter:blur(0);} }
    @keyframes loaderOut { to { opacity: 0; visibility: hidden; } }

    .app { position: relative; z-index: 5; min-height: 100vh; padding: 36px 20px 64px; }
    .shell {
      max-width: 1200px; margin: 0 auto;
      border-radius: 36px; padding: 24px;
      background: linear-gradient(140deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-premium);
    }
    .title { margin: 8px 0 4px; font-size: clamp(26px,4vw,52px); font-weight: 800; }
    .subtitle { margin: 0 0 20px; color: rgba(255,255,255,.74); }

    .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .tab {
      border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff;
      border-radius: 999px; padding: 12px 18px; cursor: pointer; white-space: nowrap;
      transition: transform .4s, box-shadow .4s, background .4s;
    }
    .tab.active { transform: scale(1.05); background: rgba(255,255,255,.18); box-shadow: 0 0 24px rgba(255,255,255,.2); }

    .tab-pane { display: none; opacity: 0; transform: translateX(20px); filter: blur(8px); }
    .tab-pane.active { display: block; animation: paneIn .5s cubic-bezier(.23,1,.32,1) forwards; }
    @keyframes paneIn { to { opacity: 1; transform: translateX(0); filter: blur(0);} }

    .cards { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 18px; }
    .card {
      position: relative; overflow: hidden; border-radius: var(--card-radius); padding: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.07));
      backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.24);
      box-shadow: var(--shadow-premium);
      transition: transform .5s cubic-bezier(.23,1,.32,1), box-shadow .5s, background .5s;
      transform-style: preserve-3d;
      opacity: 0; transform: scale(.85) translateY(12px); filter: blur(6px);
    }
    .card.show { animation: cardIn .65s cubic-bezier(.23,1,.32,1) forwards; }
    @keyframes cardIn { to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0);} }
    .card::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; background:linear-gradient(120deg, rgba(255,255,255,.8), rgba(255,255,255,0), rgba(200,200,210,.55)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite: exclude; }
    .card:hover { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.08)); box-shadow: 0 40px 80px rgba(0,0,0,.65), 0 0 45px rgba(220,230,255,.2); }
    .card h3 { margin: 0 0 8px; font-size: 24px; }
    .muted { color: rgba(255,255,255,.72); }

    .input, .button {
      width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.24); background: rgba(0,0,0,.25); color: #fff;
    }
    .button { cursor: pointer; position: relative; overflow: hidden; transition: transform .25s, box-shadow .25s; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,255,255,.12); }
    .button::after { content:""; position:absolute; inset:-120% auto auto -20%; width: 30%; height: 280%; transform: rotate(25deg); background: linear-gradient(to right, transparent, rgba(255,255,255,.45), transparent); transition: left .6s; }
    .button:hover::after { left: 120%; }
    .error { color: #ffb9b9; min-height: 20px; font-size: 14px; }

    .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(0,0,0,.48); backdrop-filter: blur(8px); }
    .modal.open { display: grid; }
    .modal-box { width: min(92vw, 560px); background: rgba(22,22,28,.72); border: 1px solid rgba(255,255,255,.2); border-radius: 30px; padding: 22px; animation: modalIn .4s ease forwards; }
    @keyframes modalIn { from {opacity:0; transform: scale(.7);} to {opacity:1; transform: scale(1);} }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row .button { margin-top: 0; }

    @media (max-width: 768px){ .shell{padding:16px;border-radius:28px;} .card{border-radius:28px;} }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="mouse-glow"></div>

  <div class="loader"><div class="logo">SAYLAR</div></div>

  <main class="app">
    <section class="shell">
      <h1 class="title">Портал в Premium-измерение</h1>
      <p class="subtitle">Цифровая инсталляция для продажи аккаунтов, Telegram Premium, звёзд и TON.</p>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="stars">Звёзды</button>
        <button class="tab" data-tab="premium">Premium</button>
        <button class="tab" data-tab="ton">TON</button>
        <button class="tab" data-tab="accounts">Аккаунты</button>
      </div>

      <div class="tab-pane active" id="stars"><div class="cards"></div></div>
      <div class="tab-pane" id="premium"><div class="cards"></div></div>
      <div class="tab-pane" id="ton"><div class="cards"></div></div>
      <div class="tab-pane" id="accounts"><div class="cards"></div></div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>Реквизиты для оплаты</h2>
      <p class="muted">Т-Банк (приоритетный способ)</p>
      <div class="row"><input class="input" value="+7 900 000-00-00" readonly><button class="button copy-btn" data-copy="+79000000000">Копировать</button></div>
      <div class="row"><input class="input" value="2200 0000 0000 0000" readonly><button class="button copy-btn" data-copy="2200000000000000">Копировать</button></div>
      <button class="button" id="paidBtn">Я оплатил</button>
      <p id="status" class="muted"></p>
    </div>
  </div>

<script>
const tonMarkup = 200;
const TELEGRAM_TOKEN = '8701823510:AAHPyTTDnLAAFtd4cn8lj1mp3Vq-gGpYQlg';
const TELEGRAM_CHAT_ID = '1717982615';

const catalog = {
  stars: [{title:'Telegram Stars', text:'Покупка звёзд с приоритетной обработкой.'}],
  premium: [{title:'Telegram Premium', text:'Быстрое подключение Premium на ваш аккаунт.'}],
  ton: [{title:'TON Premium', text:'Наша фиксированная цена: 200₽ за 1 TON.', extra:'Загружаем курс...'}],
  accounts: [{title:'Готовые аккаунты', text:'С проверенной историей и аккуратной настройкой.'}]
};

let currentOrder = {tab:'stars', item:'', username:''};

function renderCards(){
  Object.entries(catalog).forEach(([tab, items]) => {
    const wrap = document.querySelector(`#${tab} .cards`);
    wrap.innerHTML = items.map(item => `
      <article class="card reveal">
        <h3>${item.title}</h3>
        <p class="muted">${item.text}</p>
        ${tab === 'ton' ? `<p class="muted ton-market" id="tonMarket">${item.extra}</p>` : ''}
        <input class="input username" placeholder="@username">
        <div class="error"></div>
        <button class="button pay-btn" data-tab="${tab}" data-item="${item.title}">Оплатить</button>
      </article>`).join('');
  });
  staggerReveal();
  enableCardTilt();
}

function validateUsername(value){
  if(value === '') return 'Введите username';
  if(value === '@') return '';
  if(!value.startsWith('@')) return 'Username должен начинаться с @';
  if(value.length < 5) return 'Минимум 5 символов вместе с @';
  if(!/^@[A-Za-z0-9_]+$/.test(value)) return 'Допустимы латиница, цифры и _';
  return '';
}

document.addEventListener('click', (e) => {
  const payBtn = e.target.closest('.pay-btn');
  if(payBtn){
    const card = payBtn.closest('.card');
    const input = card.querySelector('.username');
    const errNode = card.querySelector('.error');
    const error = validateUsername(input.value.trim());
    errNode.textContent = error;
    if(error) return;
    currentOrder = {tab: payBtn.dataset.tab, item: payBtn.dataset.item, username: input.value.trim()};
    openModal();
  }
  const tabBtn = e.target.closest('.tab');
  if(tabBtn) switchTab(tabBtn.dataset.tab);
});

document.getElementById('paidBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.textContent = 'Отправляем заказ в Telegram...';
  const text = `Новый заказ%0AРаздел: ${currentOrder.tab}%0AТовар: ${currentOrder.item}%0AUsername: ${currentOrder.username}%0AВремя: ${new Date().toLocaleString('ru-RU')}`;
  try {
    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${text}`);
    status.textContent = 'Успешно! Заявка отправлена. Модалка закроется через 3 секунды.';
    setTimeout(closeModal, 3000);
  } catch {
    status.textContent = 'Ошибка отправки. Повторите попытку.';
  }
});

document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', async () => {
  await navigator.clipboard.writeText(btn.dataset.copy);
  btn.textContent = 'Скопировано';
  setTimeout(()=>btn.textContent='Копировать',1200);
}));

function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); document.getElementById('status').textContent=''; }

document.getElementById('modal').addEventListener('click', (e)=>{ if(e.target.id==='modal') closeModal(); });

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  staggerReveal();
}

async function updateTonRate(){
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=rub');
    const data = await res.json();
    const market = data?.['the-open-network']?.rub;
    if(!market) return;
    const markupPct = ((tonMarkup - market) / market * 100).toFixed(2);
    const node = document.getElementById('tonMarket');
    if(node) node.textContent = `Рынок: ${market.toFixed(2)}₽ • Наша цена: ${tonMarkup}₽ • Наценка: ${markupPct}%`;
  } catch {}
}

function staggerReveal(){
  const activeCards = document.querySelectorAll('.tab-pane.active .card');
  activeCards.forEach((card, i) => {
    card.classList.remove('show');
    setTimeout(()=>card.classList.add('show'), 90 * (i + 1));
  });
}

function enableCardTilt(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove', (e)=>{
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `translateY(-10px) scale(1.03) rotateX(${(-y*8).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg)`;
    });
    card.addEventListener('mouseleave', ()=>{ card.style.transform = ''; });
  });
}

class ParticleNetwork {
  constructor(canvas, count=90){
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.count = count; this.p = [];
    this.resize(); this.init(); requestAnimationFrame(()=>this.draw());
    window.addEventListener('resize', ()=>this.resize());
  }
  resize(){ this.c.width = innerWidth; this.c.height = innerHeight; }
  init(){ this.p = Array.from({length: this.count}, ()=>({x:Math.random()*this.c.width,y:Math.random()*this.c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.6+0.4})); }
  draw(){
    const {ctx,c,p} = this; ctx.clearRect(0,0,c.width,c.height);
    p.forEach(a=>{ a.x+=a.vx; a.y+=a.vy; if(a.x<0||a.x>c.width)a.vx*=-1; if(a.y<0||a.y>c.height)a.vy*=-1;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fill();
      p.forEach(b=>{ const d=Math.hypot(a.x-b.x,a.y-b.y); if(d<100){ ctx.strokeStyle=`rgba(255,255,255,${(1-d/100)*.12})`; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }});
    });
    requestAnimationFrame(()=>this.draw());
  }
}

window.addEventListener('mousemove', (e)=>{
  document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
  document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
});

const io = new IntersectionObserver((entries)=>entries.forEach(en=>{ if(en.isIntersecting) en.target.classList.add('show'); }), {threshold:.2});

renderCards();
setInterval(updateTonRate, 60000);
updateTonRate();
new ParticleNetwork(document.getElementById('particleCanvas'), window.innerWidth < 768 ? 45 : 95);
document.querySelectorAll('.reveal').forEach(n=>io.observe(n));
</script>
</body>
</html>
