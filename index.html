<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYLAR — Premium Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root{
      --bg:#050506;
      --panel:rgba(255,255,255,0.07);
      --panel-strong:rgba(255,255,255,0.12);
      --text:#f4f5f7;
      --muted:rgba(235,237,242,0.72);
      --border:rgba(255,255,255,0.34);
      --silver:linear-gradient(120deg, rgba(255,255,255,.82), rgba(220,226,240,.45), rgba(255,255,255,.76));
      --ease:cubic-bezier(0.23,1,0.32,1);
      --yellow:#ffd400;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:#000;
      overflow-x:hidden;
      min-height:100vh;
      cursor:auto;
    }
    #cosmos{position:fixed;inset:0;z-index:-5;background:radial-gradient(ellipse at 50% 20%, #0f1424 0%, #060709 45%, #000 100%)}
    #starCanvas,#earthCanvas{position:absolute;inset:0;width:100%;height:100%}
    #atmo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,0) 0%,rgba(5,5,6,.55) 50%,rgba(5,5,6,.94) 100%), radial-gradient(circle at 65% 35%, rgba(61,71,93,.2), transparent 45%);mix-blend-mode:screen;animation:drift 20s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate3d(-2%,2%,0) scale(1.04)}}
    #mouseGlow{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(260px circle at 50% 50%, rgba(255,255,255,.16), rgba(170,180,210,.06) 36%, transparent 70%)}

    .loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%, #111522, #030304 70%);z-index:50;transition:opacity .7s var(--ease), visibility .7s var(--ease)}
    .loader.hidden{opacity:0;visibility:hidden}
    .loader h1{font-size:clamp(2.3rem,8vw,6rem);letter-spacing:.45em;margin:0;text-indent:.45em;filter:blur(6px);opacity:0;transform:scale(.83)}

    .shell{max-width:1200px;margin:0 auto;padding:32px 18px 90px;position:relative}
    .hero{padding:20px 10px 10px;text-align:center}
    .hero h2{font-size:clamp(1.2rem,2.2vw,2rem);font-weight:500;color:var(--muted);margin:6px 0 0;letter-spacing:.06em}
    .title{font-size:clamp(2.2rem,6vw,4.3rem);margin:0;letter-spacing:.18em;text-indent:.18em;background:linear-gradient(120deg,#fff,#bdc5d8,#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 26px rgba(255,255,255,.18)}

    .tabs{display:flex;gap:10px;overflow:auto;padding:18px 5px 2px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#eceef5;padding:12px 16px;border-radius:999px;white-space:nowrap;transition:all .45s var(--ease);backdrop-filter:blur(10px)}
    .tab.active{transform:scale(1.05);box-shadow:0 0 0 1px rgba(255,255,255,.35), 0 8px 28px rgba(151,163,194,.25);background:rgba(255,255,255,.1)}

    .panel{margin-top:20px;display:grid;gap:20px}
    .content{display:none;opacity:0;transform:translateX(16px);filter:blur(10px)}
    .content.active{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}

    .card{position:relative;border-radius:32px;padding:22px;background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(255,255,255,.05);overflow:hidden;transition:transform .5s var(--ease), box-shadow .5s var(--ease), background .5s var(--ease)}
    .card::before{content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;background:var(--silver);-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.68;animation:borderFlow 6s linear infinite}
    .card::after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle, rgba(255,255,255,.22), transparent 60%);opacity:0;transform:translateX(-35%);transition:.6s var(--ease)}
    .card:hover{transform:translateY(-12px) scale(1.04);background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.06));box-shadow:0 32px 70px rgba(0,0,0,.58),0 0 50px rgba(221,229,255,.17)}
    .card:hover::after{opacity:.36;transform:translateX(25%)}
    @keyframes borderFlow{to{filter:hue-rotate(30deg)}}

    h3{margin:0 0 14px;font-size:1.35rem}
    .muted{color:var(--muted);font-size:.95rem}
    .price{font-size:2rem;font-weight:700;margin:10px 0;text-shadow:0 0 12px rgba(255,255,255,.24);transition:transform .25s}
    .field{display:grid;gap:8px;margin-top:12px}
    input{width:100%;border:1px solid rgba(255,255,255,.24);background:rgba(10,10,11,.33);color:var(--text);padding:12px 13px;border-radius:14px;outline:none}
    .warn{color:#ffd3d3;font-size:.9rem;min-height:20px}

    .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    .option{padding:16px;border-radius:24px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);cursor:pointer;transition:all .35s var(--ease)}
    .option:hover{transform:scale(1.03);box-shadow:0 12px 28px rgba(0,0,0,.35)}
    .option.selected{box-shadow:0 0 0 1px rgba(255,255,255,.4),0 16px 34px rgba(190,205,255,.26);background:rgba(255,255,255,.12)}

    .btn{position:relative;overflow:hidden;border:none;color:#0b0b0d;background:linear-gradient(120deg,#f7f8fa,#dce1ea,#ffffff);padding:12px 18px;border-radius:999px;font-weight:700;cursor:pointer;transition:transform .35s var(--ease), box-shadow .35s var(--ease);margin-top:14px}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 24px rgba(255,255,255,.25)}
    .btn::before{content:"";position:absolute;inset:0;transform:translateX(-130%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transition:transform .65s var(--ease)}
    .btn:hover::before{transform:translateX(130%)}

    .modalWrap{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:60}
    .modal{width:min(660px,92vw);border-radius:34px;background:rgba(255,255,255,.11);padding:22px;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px)}
    .bank{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,212,0,.95);color:#111;font-weight:700}
    .line{display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;margin-top:10px}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;white-space:nowrap;overflow:auto}
    .success{color:#b9ffcf;min-height:20px;margin-top:10px}

    @media (max-width:740px){
      .card{border-radius:28px}
      .shell{padding-top:14px}
    }
  </style>
</head>
<body>
  <div id="cosmos"><canvas id="starCanvas"></canvas><canvas id="earthCanvas"></canvas><div id="atmo"></div></div>
  <div id="mouseGlow"></div>

  <div class="loader" id="loader"><h1>SAYLAR</h1></div>

  <main class="shell" id="app" style="opacity:0">
    <section class="hero"><h1 class="title">SAYLAR</h1><h2>Портал в Premium-измерение</h2></section>
    <div class="tabs" id="tabs"></div>
    <section class="panel" id="panel"></section>
  </main>

  <div class="modalWrap" id="modalWrap">
    <div class="modal" id="modal">
      <div class="bank">💛 T-BANK</div>
      <h3 style="margin-top:12px">Оплата заказа</h3>
      <div id="orderSummary" class="muted"></div>
      <div class="line"><span class="muted">Карта</span><span class="mono" id="cardLine">4276 1234 5678 9012</span><button class="btn" data-copy="cardLine">Скопировать</button></div>
      <div class="line"><span class="muted">Телефон</span><span class="mono" id="phoneLine">+7 999 123-45-67</span><button class="btn" data-copy="phoneLine">Скопировать</button></div>
      <button class="btn" id="paidBtn">Я оплатил</button><div class="success" id="success"></div>
    </div>
  </div>

<script>
(() => {
  const CONFIG = {
    // Цена продажи TON (можно менять здесь)
    tonPrice: 225,
    // Курс звёзд (можно менять здесь)
    starRate: 1.4,
    // Минимум звёзд (можно менять здесь)
    minStars: 50,
    // Цены Premium (можно менять здесь)
    premiumPlans:[{m:'3 месяца',p:1050},{m:'6 месяцев',p:1350},{m:'12 месяцев',p:2450}],
    // Аккаунты (можно менять здесь)
    accounts:[{n:'Великобритания (+44)',p:200},{n:'США (+1)',p:250}],
    // Реквизиты Т-Банка (можно менять здесь)
    bankCard:'4276 1234 5678 9012', bankPhone:'+7 999 123-45-67',
    // Telegram bot token/chat id (можно менять здесь)
    tgToken:'8701823510:AAHPyTTDnLAAFtd4cn8lj1mp3Vq-gGpYQlg', tgChatId:'1717982615'
  };
  cardLine.textContent = CONFIG.bankCard; phoneLine.textContent = CONFIG.bankPhone;

  const state={tab:'stars',selectedPremium:null,selectedAccount:null,tonMarket:null};
  const tabs=[{id:'stars',t:'⭐ Звёзды'},{id:'ton',t:'💎 TON'},{id:'premium',t:'👑 Premium'},{id:'accounts',t:'👤 Аккаунты'}];

  function renderTabs(){tabs.forEach(x=>{const b=document.createElement('button');b.className='tab'+(x.id===state.tab?' active':'');b.textContent=x.t;b.onclick=()=>switchTab(x.id);tabsEl.appendChild(b);});}
  function switchTab(id){state.tab=id;tabsEl.innerHTML='';renderTabs();renderPanel(true)}
  const tabsEl=document.getElementById('tabs'), panel=document.getElementById('panel'); renderTabs();

  function card(html){const d=document.createElement('article');d.className='card';d.innerHTML=html;tiltCard(d);return d;}
  function renderPanel(anim){panel.innerHTML='';const c=document.createElement('div');c.className='content active';
    if(state.tab==='stars'){
      c.append(card(`<h3>Звёзды Telegram</h3><div class='muted'>1 звезда = ${CONFIG.starRate} ₽</div>
        <div class='field'><label>Количество звёзд</label><input id='starsInput' type='number' min='1' step='1' value='50'></div>
        <div class='field'><label>У меня есть рублей</label><input id='rubInput' type='number' min='1' step='1' placeholder='Например, 1000'></div>
        <div class='price' id='starsTotal'>70 ₽</div><div class='warn' id='starsWarn'></div><button class='btn' id='payStars'>Оплатить</button>`));
    }
    if(state.tab==='ton'){
      c.append(card(`<h3>TON</h3><div class='muted'>Фикс: ${CONFIG.tonPrice} ₽ / 1 TON</div><div class='muted' id='tonMarket'>Рынок: загрузка...</div>
      <div class='field'><label>Количество TON</label><input id='tonInput' type='number' min='1' step='1' value='1'></div><div class='price' id='tonTotal'>225 ₽</div><button class='btn' id='payTon'>Оплатить</button>`));
    }
    if(state.tab==='premium'){
      c.append(card(`<h3>Telegram Premium</h3><div class='grid3' id='premiumGrid'></div><button class='btn' id='payPremium' disabled>Оплатить</button>`));
    }
    if(state.tab==='accounts'){
      c.append(card(`<h3>Аккаунты</h3><div class='grid3' id='accGrid'></div><button class='btn' id='payAcc' disabled>Оплатить</button>`));
    }
    panel.append(c); bindHandlers(); if(anim) animateSwap(c);
    staggerCards();
  }

  function bindHandlers(){
    if(state.tab==='stars'){
      const s=starsInput,r=rubInput, warn=starsWarn, tot=starsTotal, btn=payStars;
      const upd=()=>{const stars=Math.max(0,parseInt(s.value)||0);const sum=(stars*CONFIG.starRate).toFixed(1);tot.textContent=`${sum} ₽`;
        if(stars<CONFIG.minStars){warn.textContent=`Минимум ${CONFIG.minStars} звёзд`;btn.disabled=true;} else {warn.textContent='';btn.disabled=false;}}
      s.oninput=upd; r.oninput=()=>{const rub=Math.max(0,parseFloat(r.value)||0);const stars=Math.floor(rub/CONFIG.starRate);s.value=stars;upd(); if(stars<CONFIG.minStars)warn.textContent=`Минимальная сумма: ${(CONFIG.minStars*CONFIG.starRate).toFixed(1)} ₽`;};
      btn.onclick=()=>openModal(`⭐ ${s.value} звёзд · ${tot.textContent}`); upd();
    }
    if(state.tab==='ton'){tonInput.oninput=()=>{tonTotal.textContent=`${(Math.max(1,parseInt(tonInput.value)||1)*CONFIG.tonPrice).toLocaleString('ru-RU')} ₽`;pulse(tonTotal)};payTon.onclick=()=>openModal(`💎 ${tonInput.value} TON · ${tonTotal.textContent}`);updateTonMarket();}
    if(state.tab==='premium'){premiumGrid.innerHTML='';CONFIG.premiumPlans.forEach((p,i)=>{const o=document.createElement('div');o.className='option'+(state.selectedPremium===i?' selected':'');o.innerHTML=`<b>${p.m}</b><div class='muted'>${p.p} ₽</div>`;o.onclick=()=>{state.selectedPremium=i;renderPanel()};premiumGrid.append(o)});payPremium.disabled=state.selectedPremium===null;payPremium.onclick=()=>{const p=CONFIG.premiumPlans[state.selectedPremium];openModal(`👑 Premium ${p.m} · ${p.p} ₽`)};}
    if(state.tab==='accounts'){accGrid.innerHTML='';CONFIG.accounts.forEach((a,i)=>{const o=document.createElement('div');o.className='option'+(state.selectedAccount===i?' selected':'');o.innerHTML=`<b>${a.n}</b><div class='muted'>${a.p} ₽</div>`;o.onclick=()=>{state.selectedAccount=i;renderPanel()};accGrid.append(o)});payAcc.disabled=state.selectedAccount===null;payAcc.onclick=()=>{const a=CONFIG.accounts[state.selectedAccount];openModal(`👤 ${a.n} · ${a.p} ₽`)};}
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent.trim()));
  }

  async function updateTonMarket(){
    try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=rub');const j=await r.json();state.tonMarket=j['the-open-network']?.rub||null;
      if(tonMarket){const m=state.tonMarket, mark=(CONFIG.tonPrice-m).toFixed(2);tonMarket.textContent=`Рынок: ~${m} ₽ · Наценка: ${mark} ₽`;}}
    catch{if(tonMarket)tonMarket.textContent='Рынок: недоступен';}
  }
  setInterval(updateTonMarket,60000);

  function openModal(text){orderSummary.textContent=`Заказ: ${text}`;success.textContent='';modalWrap.style.display='grid';animateModal(true)}
  function closeModal(){animateModal(false);setTimeout(()=>modalWrap.style.display='none',300)}
  modalWrap.onclick=(e)=>{if(e.target===modalWrap)closeModal()};
  paidBtn.onclick=async ()=>{
    const msg=`SAYLAR заказ\n${orderSummary.textContent}\nВремя: ${new Date().toLocaleString('ru-RU')}`;
    try{await fetch(`https://api.telegram.org/bot${CONFIG.tgToken}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CONFIG.tgChatId,text:msg})});success.textContent='Оплата зафиксирована. Спасибо!';}
    catch{success.textContent='Не удалось отправить в Telegram, но заказ принят.'}
    setTimeout(closeModal,3000)
  }

  function animateModal(open){if(window.gsap){gsap.fromTo('#modal',{scale:open?.7:1,opacity:open?0:1},{scale:open?1:.7,opacity:open?1:0,duration:.35,ease:'power3.out'});} }
  function animateSwap(el){if(window.gsap){gsap.fromTo(el,{opacity:0,x:20,filter:'blur(12px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.45,ease:'power3.out'});} else {el.style.opacity=1;el.style.transform='none';el.style.filter='none';}}
  function staggerCards(){const cards=document.querySelectorAll('.card');if(window.gsap){gsap.fromTo(cards,{opacity:0,scale:.8,filter:'blur(10px)',y:24},{opacity:1,scale:1,filter:'blur(0)',y:0,duration:.75,stagger:.12,ease:'power4.out'});} }
  function pulse(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'})}
  function tiltCard(el){el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`translateY(-12px) scale(1.04) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg)`});el.addEventListener('mouseleave',()=>el.style.transform='')}

  const glow=document.getElementById('mouseGlow');window.addEventListener('mousemove',e=>glow.style.background=`radial-gradient(260px circle at ${e.clientX}px ${e.clientY}px, rgba(255,255,255,.16), rgba(170,180,210,.06) 36%, transparent 70%)`);

  const starCv=document.getElementById('starCanvas'), earthCv=document.getElementById('earthCanvas');const sctx=starCv.getContext('2d'), ectx=earthCv.getContext('2d');let w,h,stars=[];
  function resize(){w=starCv.width=earthCv.width=innerWidth;h=starCv.height=earthCv.height=innerHeight;const count=innerWidth<760?90:180;stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.4+.2,vx:(Math.random()-.5)*.08,vy:Math.random()*.14+.03,r:Math.random()*1.8+.2,a:Math.random()}));}
  addEventListener('resize',resize);resize();let rot=0;
  function draw(){sctx.clearRect(0,0,w,h);ectx.clearRect(0,0,w,h);
    stars.forEach(st=>{st.x=(st.x+st.vx+w)%w;st.y=(st.y+st.vy)%h;st.a+=.02;const tw=0.5+0.5*Math.sin(st.a);sctx.fillStyle=`rgba(255,255,255,${0.15+tw*0.7})`;sctx.beginPath();sctx.arc(st.x,st.y,st.r*st.z,0,Math.PI*2);sctx.fill();});
    const R=Math.min(w*0.42,h*0.75),cx=w*0.5,cy=h*1.06;const g=ectx.createRadialGradient(cx-R*0.28,cy-R*0.64,R*0.2,cx,cy,R);g.addColorStop(0,'#4d89c3');g.addColorStop(.5,'#1f3f67');g.addColorStop(1,'#081220');
    ectx.fillStyle=g;ectx.beginPath();ectx.arc(cx,cy,R,Math.PI,0);ectx.fill();
    ectx.save();ectx.beginPath();ectx.arc(cx,cy,R,Math.PI,0);ectx.clip();
    for(let i=-2;i<3;i++){const x=((rot*70+i*180)%500)-250;ectx.fillStyle='rgba(255,255,255,.1)';ectx.fillRect(cx-R+x,cy-R,R*.42,R*2);}rot+=0.0018;
    ectx.globalAlpha=.3;ectx.fillStyle='rgba(230,240,255,.34)';for(let i=0;i<6;i++){ectx.beginPath();ectx.ellipse(cx-R*0.45+i*90,cy-R*.5+i*14,120,30,0,0,6.28);ectx.fill();}
    ectx.restore();requestAnimationFrame(draw);
  }draw();

  renderPanel();
  const loader=document.getElementById('loader'),app=document.getElementById('app'),h1=loader.querySelector('h1');
  if(window.gsap){gsap.to(h1,{opacity:1,filter:'blur(0px)',scale:1,duration:1.1,ease:'power3.out'});}
  setTimeout(()=>{loader.classList.add('hidden');app.style.opacity=1;},2300);
})();
</script>
</body>
</html>
