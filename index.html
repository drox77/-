<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYLAR — Premium Dimension</title>
    <style>
        :root {
            --bg-deep: #060609;
            --bg-void: #0a0b10;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-border-hover: rgba(255, 255, 255, 0.22);
            --glass-shine: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e6f0;
            --text-secondary: #b0aec0;
            --text-muted: #7a7890;
            --accent-silver: #c0bdd0;
            --accent-pearl: #f0edfa;
            --card-radius: 30px;
            --transition-premium: 0.55s cubic-bezier(0.23, 1, 0.32, 1);
            --transition-fast: 0.28s cubic-bezier(0.23, 1, 0.32, 1);
            --font-heading: 'Georgia', 'Times New Roman', serif;
            --font-body: 'SF Pro Display', 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            --ton-price: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* ── Фоновые слои ─────────────────────────── */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 30% 20%, rgba(80, 70, 110, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 65%, rgba(50, 45, 75, 0.16) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(20, 18, 30, 0.9) 0%, #060609 100%);
            background-size: 220% 220%;
            animation: gradientDrift 22s ease-in-out infinite;
        }

        @keyframes gradientDrift {
            0%,
            100% {
                background-position: 0% 0%;
            }
            25% {
                background-position: 70% 30%;
            }
            50% {
                background-position: 100% 80%;
            }
            75% {
                background-position: 30% 100%;
            }
        }

        .mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle 500px at var(--mx, 50%) var(--my, 50%),
                    rgba(210, 200, 230, 0.045) 0%,
                    rgba(180, 170, 210, 0.02) 35%,
                    transparent 70%);
            transition: background 0.15s ease-out;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        /* ── Прелоадер ────────────────────────────── */
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #050508;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.7s cubic-bezier(0.23, 1, 0.32, 1),
                visibility 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: all;
        }
        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-logo {
            font-family: var(--font-heading);
            font-size: clamp(2.8rem, 7vw, 5rem);
            letter-spacing: 0.22em;
            color: var(--accent-pearl);
            text-shadow: 0 0 70px rgba(210, 195, 240, 0.55),
                0 0 160px rgba(180, 160, 220, 0.3),
                0 4px 20px rgba(0, 0, 0, 0.6);
            animation: logoFadeIn 1.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center;
            filter: blur(4px);
            opacity: 0;
        }
        @keyframes logoFadeIn {
            0% {
                filter: blur(12px);
                opacity: 0;
                transform: scale(0.55);
                letter-spacing: 0.5em;
            }
            60% {
                filter: blur(1px);
                opacity: 1;
                transform: scale(1.02);
                letter-spacing: 0.22em;
            }
            100% {
                filter: blur(0px);
                opacity: 1;
                transform: scale(1);
                letter-spacing: 0.22em;
            }
        }
        .preloader-ring {
            width: 50px;
            height: 50px;
            margin-top: 28px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: rgba(220, 210, 245, 0.7);
            border-radius: 50%;
            animation: ringSpin 0.9s linear infinite;
            opacity: 0;
            animation-delay: 0.6s;
            animation-fill-mode: forwards;
        }
        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* ── Основной контент ────────────────────── */
        .main-content {
            position: relative;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 24px 20px 40px;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-content.visible {
            opacity: 1;
        }

        /* ── Заголовок ────────────────────────────── */
        .header {
            text-align: center;
            padding: 18px 0 8px;
            width: 100%;
        }
        .header-logo {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            letter-spacing: 0.18em;
            background: linear-gradient(180deg,
                    #f5f2ff 0%,
                    #c8c0e0 35%,
                    #9a90b8 70%,
                    #6a6088 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 18px rgba(190, 175, 220, 0.5));
            animation: headerShimmer 5s ease-in-out infinite;
        }
        @keyframes headerShimmer {
            0%,
            100% {
                filter: drop-shadow(0 0 18px rgba(190, 175, 220, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 32px rgba(210, 195, 240, 0.75));
            }
        }
        .header-subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.28em;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* ── Табы ─────────────────────────────────── */
        .tabs-nav {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 8px 4px 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 4;
        }
        .tabs-nav::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            position: relative;
            padding: 12px 26px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.025);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-fast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            outline: none;
            font-weight: 400;
            flex-shrink: 0;
        }
        .tab-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #d0cce0;
            box-shadow: 0 0 24px rgba(160, 145, 200, 0.15);
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.28);
            color: #f5f2ff;
            font-weight: 500;
            box-shadow: 0 0 30px rgba(180, 160, 220, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: scale(1.04);
            letter-spacing: 0.08em;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 52px;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .tab-btn.active::after {
            opacity: 1;
        }

        /* ── Контейнер вкладок ───────────────────── */
        .tab-panels {
            width: 100%;
            position: relative;
            min-height: 420px;
        }
        .tab-panel {
            display: none;
            width: 100%;
            animation: panelFadeOut 0.35s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .tab-panel.active {
            display: block;
            animation: panelFadeIn 0.45s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes panelFadeIn {
            from {
                opacity: 0;
                transform: translateX(18px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }
        @keyframes panelFadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
            to {
                opacity: 0;
                transform: translateX(-18px);
                filter: blur(6px);
            }
        }

        /* ── Сетка карточек ──────────────────────── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
            width: 100%;
            perspective: 1200px;
        }

        /* ── Стеклянная карточка ─────────────────── */
        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--card-radius);
            padding: 28px 24px 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.45),
                0 1px 3px rgba(255, 255, 255, 0.04) inset,
                0 20px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            transition: var(--transition-premium);
            transform-style: preserve-3d;
            cursor: default;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.88);
            animation: cardAppear 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-play-state: paused;
            will-change: transform, box-shadow;
        }
        .glass-card.revealed {
            animation-play-state: running;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: calc(var(--card-radius) + 2px);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.18) 0%,
                    rgba(255, 255, 255, 0.04) 30%,
                    rgba(255, 255, 255, 0.12) 60%,
                    rgba(255, 255, 255, 0.02) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.5s;
        }
        .glass-card:hover::before {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.3) 0%,
                    rgba(255, 255, 255, 0.08) 30%,
                    rgba(255, 255, 255, 0.22) 60%,
                    rgba(255, 255, 255, 0.04) 100%);
            opacity: 1;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center,
                    rgba(255, 255, 255, 0.07) 0%,
                    transparent 60%);
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .glass-card:hover::after {
            opacity: 1;
        }
        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .glass-card:hover {
            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.55),
                0 2px 6px rgba(255, 255, 255, 0.06) inset,
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 50px rgba(170, 155, 210, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* внутренний контент карточки */
        .card-content {
            position: relative;
            z-index: 2;
        }
        .card-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            color: var(--accent-pearl);
            margin-bottom: 6px;
            font-weight: 400;
        }
        .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .card-price {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #e8e0f5;
            margin-bottom: 4px;
            font-family: var(--font-heading);
        }
        .card-price-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .card-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #e0ddf0;
            font-family: var(--font-body);
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            outline: none;
            transition: var(--transition-fast);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            margin-bottom: 12px;
        }
        .card-input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(170, 155, 210, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }
        .card-input.invalid {
            border-color: rgba(255, 100, 100, 0.45);
            box-shadow: 0 0 16px rgba(255, 80, 80, 0.1);
        }
        .card-input.valid {
            border-color: rgba(140, 220, 140, 0.4);
            box-shadow: 0 0 16px rgba(120, 220, 120, 0.08);
        }
        .validation-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: -8px;
            margin-bottom: 10px;
            letter-spacing: 0.03em;
            min-height: 18px;
            transition: color 0.3s;
        }
        .validation-hint.error {
            color: #e07070;
        }
        .validation-hint.success {
            color: #80c880;
        }

        /* ── Кнопки ───────────────────────────────── */
        .btn-premium {
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 18px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #e8e0f5;
            font-family: var(--font-body);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            font-weight: 500;
            text-transform: uppercase;
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            outline: none;
        }
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.1) 40%,
                    rgba(255, 255, 255, 0.18) 50%,
                    rgba(255, 255, 255, 0.1) 60%,
                    transparent 100%);
            z-index: 2;
            transition: left 0.55s ease;
        }
        .btn-premium:hover::before {
            left: 100%;
        }
        .btn-premium:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 35px rgba(170, 150, 210, 0.12);
            color: #fff;
        }
        .btn-premium:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleEffect 0.7s ease-out forwards;
            pointer-events: none;
            z-index: 3;
        }
        @keyframes rippleEffect {
            to {
                transform: scale(6);
                opacity: 0;
            }
        }

        /* ── TON-карточка особенная ──────────────── */
        .ton-rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 6px;
        }
        .ton-rate-row span {
            color: #c8c0e0;
            font-weight: 500;
        }
        .ton-markup {
            color: #b0a890 !important;
            font-size: 0.72rem;
        }

        /* ── Модальное окно ──────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(2, 2, 6, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                visibility 0.45s;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: rgba(30, 28, 42, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 32px 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            max-width: 440px;
            width: 90%;
            transform: scale(0.75);
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: center;
            position: relative;
            z-index: 101;
        }
        .modal-overlay.open .modal {
            transform: scale(1);
        }
        .modal h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            letter-spacing: 0.06em;
            margin-bottom: 18px;
            color: var(--accent-pearl);
        }
        .modal-req {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }
        .modal-req strong {
            color: #d8d0f0;
            font-weight: 500;
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #c8c0e0;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            transition: var(--transition-fast);
            white-space: nowrap;
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .btn-copy.copied {
            background: rgba(120, 200, 120, 0.2);
            border-color: rgba(140, 220, 140, 0.5);
            color: #b0e8b0;
        }
        .btn-paid {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            border-radius: 18px;
            border: none;
            background: rgba(200, 180, 230, 0.15);
            color: #e8e0f5;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 500;
            text-transform: uppercase;
        }
        .btn-paid:hover {
            background: rgba(200, 180, 230, 0.25);
            box-shadow: 0 0 30px rgba(170, 150, 210, 0.2);
        }
        .modal-success {
            display: none;
            color: #b0e8b0;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-top: 12px;
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            // ═══════════════════════════════════════════

            // ═══════════════════════════════════════════

            // Устанавливаем реквизиты из конфига
            reqBank.textContent = CONFIG.bankCard;
            reqPhone.textContent = CONFIG.bankPhone;

            let currentOrderData = null; // хранит данные текущего заказа для отправки в Telegram

            // ═══════════════════════════════════════════
            // ЧАСТИЦЫ НА CANVAS
            // ═══════════════════════════════════════════
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let animationId;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.35;
                    this.vy = (Math.random() - 0.5) * 0.35;
                    this.size = Math.random() * 1.8 + 0.4;
                    this.opacity = Math.random() * 0.5 + 0.2;
                    this.layer = Math.floor(Math.random() * 3); // 0,1,2
                }
                update() {
                    const speedFactor = 0.3 + this.layer * 0.15;
                    this.x += this.vx * speedFactor;
                    this.y += this.vy * speedFactor;

                    // Мягкое притяжение/отталкивание от мыши
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const influenceRadius = 180;
                    if (dist < influenceRadius && dist > 0) {
                        const force = (influenceRadius - dist) / influenceRadius;
                        const angle = Math.atan2(dy, dx);
                        this.vx += Math.cos(angle) * force * 0.015;
                        this.vy += Math.sin(angle) * force * 0.015;
                    }

                    // Затухание скорости
                    this.vx *= 0.999;
                    this.vy *= 0.999;

                    // Ограничение скорости
                    const maxSpeed = 0.7;
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    // Зацикливание
                    if (this.x < -20) this.x = canvas.width + 20;
                    if (this.x > canvas.width + 20) this.x = -20;
                    if (this.y < -20) this.y = canvas.height + 20;
                    if (this.y > canvas.height + 20) this.y = -20;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(210,200,230,${this.opacity})`;
                    ctx.fill();
                    // Свечение
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(180,170,210,${this.opacity * 0.25})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                const count = Math.min(Math.floor((canvas.width * canvas.height) / 7500), 200);
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }
            initParticles();

            function drawConnections() {
                const maxDist = 130;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.18;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(190,180,215,${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                drawConnections();
                animationId = requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // Отслеживание мыши для частиц и блика
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                mouseGlow.style.setProperty('--mx', mouseX + 'px');
                mouseGlow.style.setProperty('--my', mouseY + 'px');

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouseX = e.touches[0].clientX;
                    mouseY = e.touches[0].clientY;
                    mouseGlow.style.setProperty('--mx', mouseX + 'px');

            }, { passive: true });

            // ═══════════════════════════════════════════

            // ═══════════════════════════════════════════
            // ПОСТРОЕНИЕ КАРТОЧЕК

                  <button class="btn-premium pay-btn">Оплатить</button>
                </div>
              `;
                return card;
            }

            function buildTonCard(product, index, marketRate) {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.style.animationDelay = (index * 0.08) + 's';
                card.setAttribute('data-product-id', product.id);
                card.setAttribute('data-category', 'ton');

                const marketDisplay = marketRate !== null ? `${marketRate.toFixed(1)} ₽` : 'Загрузка...';
                card.innerHTML = `
                <div class="card-content">
                  <div class="card-title">${product.title}</div>
                  <div class="card-desc">${product.desc} — фикс. ${CONFIG.tonPriceFixed}₽/TON</div>

                  <div class="ton-rate-row">

                  <div class="ton-rate-row">
                    <span>Наша наценка:</span>
                    <span class="ton-markup">+${markupDisplay}₽</span>
                  </div>
                  <input type="text" class="card-input username-input" placeholder="@username" autocomplete="off" spellcheck="false" style="margin-top:10px;">
                  <div class="validation-hint">Введите Telegram username</div>
                  <button class="btn-premium pay-btn">Оплатить</button>
                </div>
              `;
                return card;
            }

            function populateCards() {
                const containers = {
                    stars: document.getElementById('cardsStars'),
                    premium: document.getElementById('cardsPremium'),
                    ton: document.getElementById('cardsTon'),
                    accounts: document.getElementById('cardsAccounts'),

                // Звёзды
                products.stars.forEach((p, i) => {

                // Premium
                products.premium.forEach((p, i) => {
                    containers.premium.appendChild(buildCard(p, 'premium', i));

                // TON — заполняется после получения курса
                // Аккаунты
                products.accounts.forEach((p, i) => {
                    containers.accounts.appendChild(buildCard(p, 'accounts', i));

            populateCards();

            // ═══════════════════════════════════════════
            // API COINGECKO — курс TON
            // ═══════════════════════════════════════════
            let currentTonMarketRate = null;

            async function fetchTonRate() {
                try {
                    const resp = await fetch(CONFIG.coingeckoApi);
                    const data = await resp.json();
                    if (data['the-open-network'] && data['the-open-network'].rub) {
                        currentTonMarketRate = data['the-open-network'].rub;

                } catch (err) {
                    console.warn('CoinGecko API error:', err.message);
                    // Оставляем предыдущее значение или заглушку
                    updateTonCards();
                }

            function updateTonCards() {
                const container = document.getElementById('cardsTon');
                container.innerHTML = '';
                const marketDisplay = currentTonMarketRate !== null ?
                    `${currentTonMarketRate.toFixed(1)} ₽` :

                products.ton.forEach((p, i) => {

            // ═══════════════════════════════════════════
            document.addEventListener('mousemove', (e) => {

                cards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -8;
                    const rotateY = ((x - centerX) / centerX) * 8;
                    card.style.transform =
                        `translateY(-8px) scale(1.03) perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                    card.style.boxShadow = `
                0 22px 55px rgba(0,0,0,0.55),
                0 2px 6px rgba(255,255,255,0.06) inset,
                0 30px 80px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.06) inset,
                0 ${Math.abs(rotateY)*1.5}px ${Math.abs(rotateX)*2}px rgba(170,155,210,0.1)
              `;
                });
            });
            document.addEventListener('mouseleave', () => {
                document.querySelectorAll('.glass-card').forEach(card => {

            // Сбрасываем при уходе с карточки
            document.addEventListener('mouseout', (e) => {
                const card = e.target.closest('.glass-card');

                    card.style.transform = '';
                    card.style.boxShadow = '';
                }
            });

            // ═══════════════════════════════════════════
            // RIPPLE-ЭФФЕКТ НА КНОПКАХ
            // ═══════════════════════════════════════════
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn-premium, .btn-copy, .btn-paid');
                if (!btn) return;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 2;
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                btn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());

            // ═══════════════════════════════════════════

                if (!value.startsWith('@')) return 'no_at';
                if (value.length < 5) return 'too_short'; // минимум 5 символов включая @
                if (!/^@[a-zA-Z0-9_]+$/.test(value)) return 'invalid_chars';
                return 'valid';

                    case 'too_short':
                        return 'Минимум 5 символов (включая @)';

            }

            document.addEventListener('input', function(e) {
                const input = e.target.closest('.username-input');
                if (!input) return;
                const hint = input.parentElement.querySelector('.validation-hint');
                const status = validateUsername(input.value);
                input.classList.remove('invalid', 'valid');
                hint.classList.remove('error', 'success');
                if (status === 'valid') {
                    input.classList.add('valid');
                    hint.classList.add('success');
                } else if (status !== 'empty') {
                    input.classList.add('invalid');
                    hint.classList.add('error');
                }
                hint.textContent = getValidationMessage(status);
            });

            // ═══════════════════════════════════════════
            // МОДАЛЬНОЕ ОКНО
            // ═══════════════════════════════════════════
            function openModal(orderData) {
                currentOrderData = orderData;
                modalOrderInfo.textContent =
                    `Заказ: ${orderData.productTitle} | Username: ${orderData.username} | Сумма: ${orderData.price}`;
                modalSuccess.style.display = 'none';
                btnPaid.style.display = 'block';
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                currentOrderData = null;
                setTimeout(() => {
                    modalSuccess.style.display = 'none';
                    btnPaid.style.display = 'block';
                }, 400);
            }

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
            });

            // Копирование реквизитов
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const textToCopy = this.getAttribute('data-copy');
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        this.textContent = '✓ Скопировано';
                        this.classList.add('copied');
                        setTimeout(() => {
                            this.textContent = 'Копировать';
                            this.classList.remove('copied');
                        }, 1800);
                    }).catch(() => {
                        this.textContent = 'Ошибка';
                        setTimeout(() => { this.textContent = 'Копировать'; }, 1500);
                    });
                });
            });

            // Кнопка "Я оплатил" — отправка в Telegram
            btnPaid.addEventListener('click', async function() {
                if (!currentOrderData) return;
                this.disabled = true;
                this.textContent = 'Отправка...';

                const message = `💎 *Новый заказ SAYLAR*%0A` +
                    `📦 Товар: ${currentOrderData.productTitle}%0A` +
                    `👤 Username: ${currentOrderData.username}%0A` +
                    `💰 Сумма: ${currentOrderData.price}%0A` +
                    `🕐 Время: ${new Date().toLocaleString('ru-RU')}`;

                const url =
                    `https://api.telegram.org/bot${CONFIG.telegramToken}/sendMessage?chat_id=${CONFIG.telegramChatId}&text=${message}&parse_mode=Markdown`;

                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.ok) {
                        modalSuccess.style.display = 'block';
                        btnPaid.style.display = 'none';
                        setTimeout(closeModal, 3000);
                    } else {
                        alert('Ошибка отправки. Попробуйте ещё раз.');
                        this.disabled = false;
                        this.textContent = 'Я оплатил';
                    }
                } catch (err) {
                    alert('Ошибка сети. Проверьте соединение.');
                    this.disabled = false;
                    this.textContent = 'Я оплатил';
                }
            });

            // ═══════════════════════════════════════════
            // ОБРАБОТКА КНОПКИ "ОПЛАТИТЬ"
            // ═══════════════════════════════════════════
            function attachCardListeners(container) {
                container.querySelectorAll('.pay-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const card = this.closest('.glass-card');
                        const input = card.querySelector('.username-input');
                        const username = input.value.trim();
                        const status = validateUsername(username);

                        if (status !== 'valid') {
                            input.classList.add('invalid');
                            const hint = card.querySelector('.validation-hint');
                            hint.classList.add('error');
                            hint.textContent = getValidationMessage(status);
                            input.focus();
                            // Анимация встряхивания
                            input.style.animation = 'none';
                            void input.offsetWidth;
                            input.style.animation = 'shake 0.5s ease';
                            return;
                        }

                        const productId = card.getAttribute('data-product-id');
                        const category = card.getAttribute('data-category');
                        const titleEl = card.querySelector('.card-title');
                        const priceEl = card.querySelector('.card-price');
                        const productTitle = titleEl ? titleEl.textContent : productId;
                        const price = priceEl ? priceEl.textContent : '';

                        openModal({
                            productId,
                            category,
                            productTitle,
                            price,
                            username,
                        });
                    });
                });
            }

            // Прикрепляем обработчики ко всем существующим контейнерам
            ['cardsStars', 'cardsPremium', 'cardsTon', 'cardsAccounts'].forEach(id => {
                const container = document.getElementById(id);
                if (container) attachCardListeners(container);
            });

            // ═══════════════════════════════════════════
            // SHAKE-АНИМАЦИЯ ДЛЯ ИНПУТА
            // ═══════════════════════════════════════════
            const shakeKeyframes = `
            @keyframes shake {
              0%,100% { transform: translateX(0); }
              10% { transform: translateX(-6px); }
              30% { transform: translateX(6px); }
              50% { transform: translateX(-4px); }
              70% { transform: translateX(4px); }
              90% { transform: translateX(-2px); }
            }
          `;
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = shakeKeyframes;
            document.head.appendChild(shakeStyle);

            // ═══════════════════════════════════════════
            // ИНИЦИАЛИЗАЦИЯ
            // ═══════════════════════════════════════════
            console.log('%c🌌 SAYLAR Premium Dimension %cзагружен',
                'font-size:1.2em;letter-spacing:0.1em;color:#d8d0f0;',
                'color:#888;');
            console.log('%cTON фикс. цена: ' + CONFIG.tonPriceFixed +
                '₽ | Наценка: ' + CONFIG.tonMarkup + '₽',
                'color:#b0a890;');
            console.log('%cВсе элементы готовы к межгалактическим транзакциям ✦',
                'color:#7a7890;font-style:italic;');

            // Запускаем reveal для изначально видимых карточек после загрузки
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const visibleCards = document.querySelector('#panel-stars .glass-card');
                    if (visibleCards) {
                        document.querySelectorAll('#panel-stars .glass-card').forEach((c, i) => {
                            c.style.animationDelay = (i * 0.08) + 's';
                            c.classList.add('revealed');
                        });
                    }
                }, 2500);
            });

        })();
    </script>
</body>
</html>
