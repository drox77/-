<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Premium Portal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Inter, sans-serif;
  overflow:hidden;
}

/* ===== CANVAS BACKGROUND ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* ===== MOUSE GLOW ===== */
.glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background:radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 40%);
}

/* ===== INTRO ===== */
.intro{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  animation:fadeOut 2.5s forwards;
}

.logo{
  font-size:64px;
  letter-spacing:14px;
  animation:logoIn 2s ease;
  opacity:0.9;
}

@keyframes logoIn{
  from{transform:scale(0.6);opacity:0;filter:blur(12px);}
  to{transform:scale(1);opacity:1;filter:blur(0);}
}

@keyframes fadeOut{
  0%,70%{opacity:1}
  100%{opacity:0;visibility:hidden}
}

/* ===== NAV ===== */
.nav{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  z-index:4;
}

.tab{
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(14px);
  cursor:pointer;
  font-size:12px;
  letter-spacing:2px;
  transition:0.4s;
}

.tab.active{
  background:rgba(255,255,255,0.18);
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,255,255,0.15);
}

/* ===== GRID ===== */
.grid{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}

/* ===== CARD ===== */
.card{
  width:340px;
  padding:28px;
  border-radius:32px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  transition:0.5s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  background:rgba(255,255,255,0.1);
}

button{
  margin-top:14px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  background:#fff;
  color:#000;
  font-weight:600;
}

/* ===== MODAL ===== */
.modalBg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.modal{
  width:420px;
  padding:24px;
  border-radius:28px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  animation:pop 0.4s ease;
}

@keyframes pop{
  from{transform:scale(0.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

input{
  width:100%;
  margin-top:12px;
  padding:10px;
  border-radius:12px;
  border:none;
  outline:none;
}

/* ===== STATUS ===== */
.ok{border:1px solid #0f0;}
.bad{border:1px solid #f00;}

</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="glow" id="glow"></div>

<!-- INTRO -->
<div class="intro">
  <div class="logo">SAYLAR</div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="tab active" onclick="setTab('ton')">TON</div>
  <div class="tab" onclick="setTab('stars')">STARS</div>
  <div class="tab" onclick="setTab('premium')">PREMIUM</div>
  <div class="tab" onclick="setTab('accounts')">ACCOUNTS</div>
</div>

<!-- CONTENT -->
<div class="grid" id="content"></div>

<!-- MODAL -->
<div id="modal" class="modalBg" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Payment Portal</h3>

    <p>Т-Банк</p>
    <button onclick="copy('0000 0000 0000 0000')">Copy card</button>
    <button onclick="copy('+7 900 000 00 00')">Copy phone</button>

    <input id="username" placeholder="@username" />

    <button onclick="pay()">I have paid</button>
  </div>
</div>

<script>
let tonPrice = 0;
let currentTab = "ton";

/* ===== TON API ===== */
async function loadTON(){
  try{
    let r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=rub");
    let j = await r.json();
    tonPrice = j["the-open-network"].rub;
  }catch(e){}
}
loadTON();
setInterval(loadTON,60000);

/* ===== TABS ===== */
function setTab(t){
  currentTab = t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

/* ===== RENDER ===== */
function render(){
  let c = document.getElementById("content");

  if(currentTab==="ton"){
    c.innerHTML = `
      <div class="card">
        <h2>TON Portal</h2>
        <p>Market: ${tonPrice ? tonPrice.toFixed(2) : "..."} ₽</p>
        <p>Fixed: 200 ₽</p>
        <p>Premium pricing</p>
        <button onclick="openModal()">Buy TON</button>
      </div>
    `;
  }

  if(currentTab==="stars"){
    c.innerHTML = `
      <div class="card">
        <h2>Telegram Stars</h2>
        <p>Instant delivery</p>
        <button onclick="openModal()">Buy Stars</button>
      </div>`;
  }

  if(currentTab==="premium"){
    c.innerHTML = `
      <div class="card">
        <h2>Telegram Premium</h2>
        <p>Ultra activation</p>
        <button onclick="openModal()">Buy Premium</button>
      </div>`;
  }

  if(currentTab==="accounts"){
    c.innerHTML = `
      <div class="card">
        <h2>Accounts Vault</h2>
        <p>Ready profiles</p>
        <button onclick="openModal()">Buy Account</button>
      </div>`;
  }
}
render();

/* ===== MODAL ===== */
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* ===== COPY ===== */
function copy(text){
  navigator.clipboard.writeText(text);
}

/* ===== PAYMENT ===== */
function pay(){
  let u = document.getElementById("username").value;

  if(!/^@[a-zA-Z0-9_]{4,}$/.test(u)){
    alert("Invalid username");
    return;
  }

  fetch("https://api.telegram.org/bot<YOUR_TOKEN>/sendMessage",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:"<YOUR_CHAT_ID>",
      text:`Order: ${currentTab}\nUser: ${u}`
    })
  });

  setTimeout(()=>closeModal(),3000);
}

/* ===== BACKGROUND PARTICLES ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let w,h,particles=[];

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;

  particles = Array.from({length:100},()=>({
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3,
    r:Math.random()*1.5
  }));
}

function draw(){
  ctx.clearRect(0,0,w,h);

  for(let p of particles){
    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;

    ctx.beginPath();
    ctx.fillStyle="rgba(255,255,255,0.08)";
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

resize();
draw();
window.addEventListener("resize",resize);

/* ===== MOUSE GLOW ===== */
document.addEventListener("mousemove",(e)=>{
  document.getElementById("glow").style.background =
  `radial-gradient(circle 600px at ${e.clientX}px ${e.clientY}px, rgba(255,255,255,0.08), transparent 40%)`;
});
</script>

</body>
</html>
